<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maple Valley Life Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: system-ui, sans-serif; touch-action: none; }
    #info { position: absolute; z-index: 5; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px; font-size: 14px; pointer-events: none; }
    #instructions { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 8px; text-align: center; }
    #instructions.hidden { display: none; }
    button { margin-top: 10px; padding: 8px 16px; font-size: 16px; cursor: pointer; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0.8; }
    #joystick { position: absolute; z-index: 5; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: none; touch-action: none; }
    #joystick-knob { position: absolute; width: 50px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 50%; top: 35px; left: 35px; }
    .mobile #joystick { display: block; }
  </style>
</head>
<body>
  <div id="info">Maple Valley Life Simulator<br>WASD to move • Space to jump<br>E to interact • Mouse to look<br>Tab frees the mouse • Esc pauses</div>
  <div id="crosshair"></div>
  <div id="joystick"><div id="joystick-knob"></div></div>
  <div id="instructions">
    <h2>Maple Valley Life Simulator</h2>
    <p>Click / tap to start</p>
    <button id="start">Start</button>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
  <script>
    // Always run the newest game code after an update (see sw.js).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
