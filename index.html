<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maple Valley Life Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px; font-size: 14px; pointer-events: none; }
    #instructions { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 8px; text-align: center; }
    #instructions.hidden { display: none; }
    button { margin-top: 10px; padding: 8px 16px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="info">Maple Valley Life Simulator<br>WASD / Arrows to move<br>Mouse to look (click to lock)</div>
  <div id="instructions">
    <h2>Maple Valley Life Simulator</h2>
    <p>Click to start / lock mouse</p>
    <button id="start">Start</button>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
