<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maple Valley Life Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: system-ui, sans-serif; touch-action: none; }
    #info { position: absolute; z-index: 5; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px; font-size: 13px; line-height: 1.35; pointer-events: none; }
    body.mobile #info { display: none; }
    #instructions { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 8px; text-align: center; }
    #instructions.hidden { display: none; }
    button { margin-top: 10px; padding: 8px 16px; font-size: 16px; cursor: pointer; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0.8; }
    #joystick { position: absolute; z-index: 5; bottom: 28px; left: 28px; width: 112px; height: 112px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; display: none; touch-action: none; }
    #joystick-knob { position: absolute; width: 46px; height: 46px; background: rgba(255,255,255,0.7); border-radius: 50%; top: 33px; left: 33px; }
    .mobile #joystick { display: block; }
    #fly-pad { position: absolute; z-index: 5; right: 24px; bottom: 120px; display: none; flex-direction: column; gap: 14px; touch-action: none; }
    .mobile.flying #fly-pad { display: flex; }
    #fly-pad button { width: 72px; height: 72px; border-radius: 50%; font-size: 28px; color: #fff; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); touch-action: none; user-select: none; -webkit-user-select: none; }
    #fly-pad button.is-held { background: rgba(255,255,255,0.45); }
    .day-one { position: fixed; z-index: 15; top: calc(max(12px, env(safe-area-inset-top)) + 42px); left: 50%; transform: translateX(-50%); width: min(460px, calc(100vw - 380px)); max-width: calc(100vw - 24px); box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border: 1px solid #c6ad7770; border-radius: 9px; background: rgba(22, 31, 25, 0.90); color: #fbf4e4; box-shadow: 0 4px 16px #0006; pointer-events: none; }
    .day-one[hidden] { display: none; }
    .day-one > div { min-width: 0; flex: 1 1 auto; }
    .day-one h2 { font-size: 14px; line-height: 1.2; margin: 0 0 2px; color: #f5dfae; }
    .day-one p { font-size: 12px; line-height: 1.3; margin: 0; }
    .day-one button { pointer-events: auto; flex: 0 0 auto; min-height: 30px; margin-top: 0; padding: 5px 10px; border: 1px solid #c6ad77; border-radius: 6px; color: #fff6dc; background: #304336; font-size: 11px; font-weight: 600; white-space: nowrap; }
    body.mobile .day-one { top: calc(max(8px, env(safe-area-inset-top)) + 36px); width: min(390px, calc(100vw - 210px)); padding: 6px 9px; gap: 8px; }
    body.mobile .day-one h2 { font-size: 12px; margin: 0 0 1px; }
    body.mobile .day-one p { font-size: 11px; line-height: 1.25; }
    body.mobile .day-one button { min-height: 28px; padding: 4px 8px; font-size: 11px; }
    @media (max-width: 540px) {
      .day-one, body.mobile .day-one { left: max(8px, env(safe-area-inset-left)); right: calc(max(10px, env(safe-area-inset-right)) + 52px); transform: none; width: auto; max-width: none; }
    }
    .day-one-cinematic { top: auto; bottom: 0; left: 0; width: 100%; transform: none; padding: 14px max(18px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)); border-radius: 0; }
    .day-one-cinematic h2 { font: 600 clamp(22px, 4vw, 34px) Georgia, serif; }
    .road-trip { --bar: max(9vh, calc((100vh - 100vw / 2.35) / 2)); position: fixed; inset: 0; z-index: 200; color: #f4e7ce; font-family: Georgia, serif; overflow: hidden; }
    #info, #joystick, #crosshair, .hud-ui { transition: opacity .45s ease; }
    .intro-active :is(#info, #joystick, #crosshair, .hud-ui) { opacity: 0 !important; pointer-events: none !important; }
    .road-trip[hidden] { display: none; }
    .road-trip.finished { pointer-events: none; background: transparent !important; }
    .road-trip-bar { background: #090807; position: absolute; left: 0; right: 0; height: var(--bar); transition: transform .6s ease; }
    .road-trip-bar.top { top: 0; transform: translateY(-100%); }
    .road-trip-bar.bottom { bottom: 0; transform: translateY(100%); }
    .road-trip.playing .road-trip-bar { transform: translateY(0); }
    @media (orientation: portrait) { .road-trip { --bar: 12vh; } }
    .road-trip-title { position: absolute; top: 46%; width: 100%; text-align: center; text-shadow: 0 2px 15px #19140d; opacity: 0; }
    .road-trip-title strong { display: block; font-size: clamp(27px, 7vw, 92px); font-weight: 500; letter-spacing: .19em; padding-left: .19em; }
    .road-trip-title span { font-size: clamp(14px, 2vw, 27px); letter-spacing: .16em; }
    .road-trip-caption, .road-trip-notice { position: absolute; opacity: 0; bottom: calc(var(--bar) + 14px); left: 5%; padding: 6px 10px; background: #211d16b0; font-size: 15px; }
    .road-trip-notice { left: auto; right: 5%; bottom: calc(var(--bar) + 28px); }
    .road-trip-story { position: absolute; left: 50%; bottom: calc(var(--bar) + 16px); transform: translateX(-50%); max-width: min(86vw, 520px); padding: 7px 14px; border-left: 3px solid #d4943a; background: rgba(14, 15, 17, 0.78); color: #f6eedc; font: italic 16px/1.35 Georgia, serif; text-align: center; opacity: 0; pointer-events: none; }
    .road-trip-loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 16px; background: #0e0d0a; font-size: clamp(18px, 4vw, 28px); transition: opacity .9s ease; pointer-events: none; }
    .road-trip:not(.loading) .road-trip-loading { opacity: 0; }
    .road-trip-loading progress { width: min(58vw, 250px); height: 5px; accent-color: #cfad75; }
    .road-trip-skip, .road-trip-ff { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); border: 1px solid #ae9674; border-radius: 6px; background: #231f19; color: inherit; font-size: 14px; padding: 7px 12px; margin: 0; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .road-trip-skip { right: max(14px, env(safe-area-inset-right)); }
    .road-trip-ff { right: calc(max(14px, env(safe-area-inset-right)) + 104px); }
    .road-trip-ff.is-fast { background: #4a3a22; border-color: #e6bf78; }
    .road-trip.finished .road-trip-skip, .road-trip.finished .road-trip-ff, .road-trip.finished .road-trip-title, .road-trip.finished .road-trip-caption, .road-trip.finished .road-trip-notice, .road-trip.finished .road-trip-story { visibility: hidden; }
    .day-one-chapter { position: fixed; z-index: 44; top: 22vh; left: 50%; transform: translate(-50%, -8px); text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.55s ease, transform 0.65s ease; }
    .day-one-chapter.is-visible { opacity: 1; transform: translate(-50%, 0); }
    .day-one-chapter strong { display: block; font: 800 clamp(22px, 4.5vw, 38px)/1.05 system-ui, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: #f6efe0; text-shadow: 0 3px 16px rgba(0, 0, 0, 0.78); }
    .day-one-chapter span { display: inline-block; margin-top: 6px; padding-top: 5px; border-top: 2px solid #d4943a; font: 600 clamp(11px, 1.8vw, 14px)/1.2 system-ui, sans-serif; letter-spacing: 0.24em; text-transform: uppercase; color: #dfbe84; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75); }
    @media (prefers-reduced-motion: reduce) { .road-trip-bar { transition-duration: .2s; } }
  </style>
</head>
<body>
  <div id="info">Maple Valley Life Simulator<br>WASD to move • Shift to run • Space to jump<br>E to interact • Mouse to look<br>Tab frees the mouse • Esc pauses</div>
  <div id="crosshair"></div>
  <div id="joystick"><div id="joystick-knob"></div></div>
  <div id="fly-pad" aria-label="Fly up and down">
    <button type="button" id="fly-up" aria-label="Fly up">▲</button>
    <button type="button" id="fly-down" aria-label="Fly down">▼</button>
  </div>
  <div id="instructions">
    <h2>Maple Valley Life Simulator</h2>
    <p>Click / tap to start</p>
    <button id="start">Start</button>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
  <script>
    // Always run the newest game code after an update (see sw.js).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
